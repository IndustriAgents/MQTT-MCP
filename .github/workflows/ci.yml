name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded pull request runs to save CI minutes. Pushes to main are
# never cancelled, so every commit on main keeps a finished run (and the badge
# reflects it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each uv project is synced from its committed uv.lock (`--locked` fails the job
# if pyproject.toml and uv.lock have drifted apart). The matrix covers the
# declared floor (requires-python >=3.10) and the current stable release.
# The integration tests and the mock smoke run need an MQTT broker: a throwaway
# Mosquitto container on 127.0.0.1:1883 (the command from the README). The
# lowest-direct job runs the suite against the lowest versions of the declared
# direct dependencies, so the floors in pyproject.toml stay honest (the mock's
# floors are the same paho-mqtt and protobuf, and the suite runs the mock).
jobs:
  server:
    name: mqtt-python (MCP server) / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: mqtt-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Check formatting (ruff format)
        run: uv run --locked ruff format --check .

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src tests

      - name: Import the console-script target
        run: |
          uv run --locked python - <<'EOF'
          from importlib.metadata import entry_points

          (ep,) = entry_points(group="console_scripts", name="mqtt-mcp")
          assert callable(ep.load()), ep
          print(f"mqtt-mcp -> {ep.value}")
          EOF

      - name: mqtt-mcp --help
        run: uv run --locked mqtt-mcp --help

      # The server keeps retrying an unreachable broker in the background, so
      # this needs no broker: it proves the server boots and answers MCP over
      # stdio. Port 1 is used so that nothing on the runner can answer as a
      # broker.
      - name: MCP handshake over stdio (initialize + tools/list)
        env:
          MQTT_BROKER_URL: mqtt://127.0.0.1:1
        run: |
          uv run --locked python - <<'EOF'
          import asyncio
          import os

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client


          async def main() -> None:
              params = StdioServerParameters(
                  command="uv", args=["run", "--locked", "mqtt-mcp"], env=dict(os.environ)
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      init = await session.initialize()
                      tools = (await session.list_tools()).tools
                      print(f"{init.serverInfo.name}: {len(tools)} tools")
                      print(", ".join(sorted(t.name for t in tools)))
                      assert tools, "the server registered no tools"


          asyncio.run(asyncio.wait_for(main(), timeout=120))
          EOF

      - name: Start an MQTT broker (Mosquitto)
        run: |
          docker run -d --name mqtt-broker -p 127.0.0.1:1883:1883 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for _ in $(seq 30); do
            docker exec mqtt-broker mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 2 \
              && exit 0
            sleep 1
          done
          docker logs mqtt-broker
          exit 1

      # Unit tests plus the integration tests: broker + mock edge node + the
      # real server over stdio. MQTT_TEST_REQUIRE_BROKER turns a missing broker
      # into a failure instead of a skip.
      - name: Tests (pytest)
        env:
          MQTT_TEST_BROKER_URL: mqtt://127.0.0.1:1883
          MQTT_TEST_REQUIRE_BROKER: "1"
        run: uv run --locked pytest -v

      - name: Broker log
        if: failure()
        run: docker logs mqtt-broker || true

  lowest-direct:
    name: mqtt-python, lowest direct dependencies / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: mqtt-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the lowest declared versions of the direct dependencies
        run: |
          uv venv .venv-lowest
          uv pip install --python .venv-lowest --resolution lowest-direct -e . --group dev
          uv pip list --python .venv-lowest

      - name: Start an MQTT broker (Mosquitto)
        run: |
          docker run -d --name mqtt-broker -p 127.0.0.1:1883:1883 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for _ in $(seq 30); do
            docker exec mqtt-broker mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 2 \
              && exit 0
            sleep 1
          done
          docker logs mqtt-broker
          exit 1

      - name: Tests (pytest)
        env:
          MQTT_TEST_BROKER_URL: mqtt://127.0.0.1:1883
          MQTT_TEST_REQUIRE_BROKER: "1"
        run: .venv-lowest/bin/python -m pytest -v

      - name: Broker log
        if: failure()
        run: docker logs mqtt-broker || true

  mock:
    name: mqtt-mock-server / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: mqtt-mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Check formatting (ruff format)
        run: uv run --locked ruff format --check .

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q mqtt_mock_server.py sparkplug_b_pb2.py

      - name: Import the console-script target
        run: |
          uv run --locked python - <<'EOF'
          from importlib.metadata import entry_points

          (ep,) = entry_points(group="console_scripts", name="mqtt-mock-server")
          assert callable(ep.load()), ep
          print(f"mqtt-mock-server -> {ep.value}")
          EOF

      - name: Start an MQTT broker (Mosquitto)
        run: |
          docker run -d --name mqtt-broker -p 127.0.0.1:1883:1883 \
            eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for _ in $(seq 30); do
            docker exec mqtt-broker mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 2 \
              && exit 0
            sleep 1
          done
          docker logs mqtt-broker
          exit 1

      # Runs the console script from this project's own lockfile for a few
      # seconds, stops it with SIGTERM, and checks that it published and shut
      # down exactly once.
      - name: Run the mock against the broker
        run: |
          set -o pipefail
          timeout --signal=TERM --preserve-status 8 uv run --locked mqtt-mock-server | tee mock.log
          grep -q "Connected to broker" mock.log
          grep -q "Update cycle" mock.log
          test "$(grep -c 'Shutting down' mock.log)" = 1
          test "$(grep -c 'Shutdown complete' mock.log)" = 1
