blank_issues_enabled: false
contact_links:
  - name: Question or usage help
    url: https://github.com/IndustriAgents/MQTT-MCP/discussions
    about: Ask about configuration, MCP clients, or connecting to your own broker.
  - name: IndustriConnect suite (other protocols, mcp-manager-ui)
    url: https://github.com/IndustriAgents/IndustriConnect/issues
    about: Issues that are not specific to the MQTT server belong in the suite repository.
  - name: Model Context Protocol docs
    url: https://modelcontextprotocol.io
    about: Reference for MCP itself — transports, clients, and the tool interface.
  - name: Security vulnerability
    url: https://github.com/IndustriAgents/MQTT-MCP/security/policy
    about: Report privately. Please do not open a public issue.
